name: Update developer quote

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick a new quote
        run: python scripts/dev_quote.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev-quote.svg
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update developer quote [skip ci]"
            git push
          fi
