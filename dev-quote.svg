<svg xmlns="http://www.w3.org/2000/svg" width="860" height="156" viewBox="0 0 860 156" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>The function of good software is to make the complex appear to be simple.</title>
<rect x="1" y="1" width="858" height="154" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="1" y="1" width="8" height="154" rx="4" fill="#00d4ff"/>
<text x="40" y="38" font-size="12" letter-spacing="2" fill="#8b949e">DEVELOPER QUOTE</text>
<text x="40" y="76" font-size="21" font-style="italic" fill="#e6edf3">“The function of good software is to make the complex appear to</text>
<text x="40" y="106" font-size="21" font-style="italic" fill="#e6edf3">be simple.”</text>
<text x="820" y="132" font-size="15" fill="#00d4ff" text-anchor="end">— Grady Booch</text>
</svg>