<title>Programming isn&#x27;t about what you know; it&#x27;s about what you can figure out.</title>
<rect x="1" y="1" width="858" height="154" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="1" y="1" width="8" height="154" rx="4" fill="#00d4ff"/>
<text x="40" y="38" font-size="12" letter-spacing="2" fill="#8b949e">DEVELOPER QUOTE</text>
<text x="40" y="76" font-size="21" font-style="italic" fill="#e6edf3">“Programming isn&#x27;t about what you know; it&#x27;s about what you can</text>
